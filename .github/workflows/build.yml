name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        defines: ["", "BLINKY_ENABLE_MQTT=1", "BLINKY_CAN_NODE=1"]
    steps:
      - uses: actions/checkout@v5
      - name: Install the ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja "-DBLINKY_DEFINES=${{ matrix.defines }}"
          cmake --build build
      - uses: actions/upload-artifact@v4
        if: matrix.defines == ''
        with:
          name: vscp-blinky
          path: |
            build/vscp-blinky.elf
            build/vscp-blinky.bin
            build/vscp-blinky.hex
